<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact — Arda Gün</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #FAFAF8;
            --text-dark: #1A1A1A;
            --accent-green: #2D7D6F;
            --neutral-divider: #E5E5E0;
            --text-gray: #555555;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, .nav-brand, .nav-links a {
            font-family: 'JetBrains Mono', monospace;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 5%;
            border-bottom: 1px solid var(--neutral-divider);
        }

        .nav-brand {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .nav-links a {
            margin-left: 2rem;
            text-decoration: none;
            color: var(--text-dark);
            font-weight: 400;
        }

        .nav-links a:hover {
            color: var(--accent-green);
        }

        main {
            max-width: 800px;
            margin: 4rem auto;
            padding: 0 5%;
        }

        .contact-container {
            margin-top: 15vh; /* İçeriği dikeyde biraz daha merkeze iter */
        }

        .hero-claim {
            font-size: 2rem;
            margin-bottom: 3rem;
            line-height: 1.3;
        }

        .contact-email {
            font-size: 1.5rem;
            color: var(--accent-green);
            text-decoration: none;
            font-weight: 600;
            border-bottom: 2px solid var(--accent-green);
            padding-bottom: 4px;
        }

        .contact-email:hover {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-brand">Arda Gün</div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="projects.html">Projects</a>
            <a href="contact.html">Contact</a>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <h1 class="hero-claim">I build LLM-based products, from architecture down to what keeps them from breaking.</h1>
            
            <p style="margin-bottom: 1rem; color: var(--text-gray);">Let's build something.</p>
            
            <!-- href "mailto:" kısmına ve görünen metne kendi mail adresini yazmalısın -->
            <a href="mailto:gunarda205@gmail.com" class="contact-email">gunarda205@gmail.com ↗</a>
        </div>
    </main>

</body>
</html>
